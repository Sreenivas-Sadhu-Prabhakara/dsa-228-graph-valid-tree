<text x="56.0" y="526.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">The edge-count shortcut removes the need for explicit cycle detection — counting</text>
<text x="56.0" y="545.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">plus connectivity is the cheapest complete test.</text>
