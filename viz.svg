<text x="56.0" y="307.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Count first: a tree has EXACTLY n−1 edges. Fewer → disconnected; more → a cycle</text>
<text x="56.0" y="326.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">exists somewhere. Then one DFS/Union-Find pass confirms all n nodes are reachable —</text>
<text x="56.0" y="345.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">with n−1 edges, connected ⟺ acyclic.</text>
<text x="24.0" y="369.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="600">cases</text>
